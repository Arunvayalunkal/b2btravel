<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .service-links {
      width: min(100% - 2rem, 760px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 14px;
    }
    .service-btn {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: .2px;
    }
  </style>
</head>
<body>
	
  <main class="service-links" aria-label="Travel services">
    <a class="btn btn-primary service-btn" target="_blank" href="Flight/index.html">Flight</a>
    <a class="btn btn-primary service-btn" target="_blank" href="Hotel/index.html">Hotel</a>
    <a class="btn btn-primary service-btn pe-none text-muted" target="_blank"  aria-disabled="true" href="Holidays/index.html">Holidays</a>
    <a class="btn btn-primary service-btn pe-none text-muted" target="_blank"  aria-disabled="true" href="Visa/index.html">Visa</a>
    <a class="btn btn-primary service-btn pe-none text-muted" target="_blank"  aria-disabled="true" href="Rail/index.html">Rail</a>
    <a class="btn btn-primary service-btn pe-none text-muted" target="_blank"  aria-disabled="true" href="Bus/index.html">Bus</a>
    <a class="btn btn-primary service-btn pe-none text-muted" target="_blank"  aria-disabled="true" href="Insurance/index.html">Insurance</a>
    <a class="btn btn-primary service-btn pe-none text-muted" target="_blank"  aria-disabled="true" href="Ferry/index.html">Ferry</a>
  </main>
</body>
</html>
